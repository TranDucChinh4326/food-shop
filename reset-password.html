<!DOCTYPE html>
<!-- Trang đặt lại mật khẩu: nhận email, mã OTP từ email và mật khẩu mới để gửi backend cập nhật tài khoản. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - Bếp 1979</title>
  <link rel="stylesheet" href="assets/css/auth-base.css?v=20260824-toast-stack">
  <link rel="stylesheet" href="assets/css/login.css?v=20260819-modern-auth">
</head>
<body>
  <main class="auth-page">
    <section class="auth-box">
      <a href="index.html" class="auth-brand brand-logo" aria-label="Bếp 1979">
        <span class="brand-mark" aria-hidden="true"><span>79</span></span>
        <span class="brand-copy"><strong>Bếp 1979</strong><small>Món ngon mỗi ngày</small></span>
      </a>
      <p class="auth-kicker">Tạo mật khẩu mới</p>
      <h1>Đặt lại mật khẩu</h1>

      <form onsubmit="resetPassword(event)">
        <label>
          Email đã đăng ký
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>
          Mã OTP
          <input type="text" id="resetOtp" placeholder="Nhập mã 6 số trong email" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
        </label>

        <label>
          Mật khẩu mới
          <input type="password" id="resetPassword" placeholder="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt" autocomplete="new-password" minlength="8" required>
        </label>

        <div class="password-strength-wrap" id="resetPasswordStrength" data-password-strength-for="resetPassword">
          <div class="password-strength-header">
            <span class="strength-label">Độ mạnh mật khẩu</span>
            <span class="strength-status" data-strength-status data-state="empty">Chưa nhập</span>
          </div>
          <div class="password-strength-bars" data-strength-bars data-strength="empty">
            <span class="strength-bar"></span>
            <span class="strength-bar"></span>
            <span class="strength-bar"></span>
            <span class="strength-bar"></span>
          </div>
          <ul class="password-criteria-list">
            <li data-criterion="length"><span class="criterion-check" aria-hidden="true"></span><span>Tối thiểu 8 ký tự</span></li>
            <li data-criterion="lowercase"><span class="criterion-check" aria-hidden="true"></span><span>Chữ thường (a-z)</span></li>
            <li data-criterion="uppercase"><span class="criterion-check" aria-hidden="true"></span><span>Chữ hoa (A-Z)</span></li>
            <li data-criterion="number"><span class="criterion-check" aria-hidden="true"></span><span>Chữ số (0-9)</span></li>
            <li data-criterion="special"><span class="criterion-check" aria-hidden="true"></span><span>Ký tự đặc biệt (!@#$...)</span></li>
          </ul>
        </div>

        <label>
          Xác nhận mật khẩu mới
          <input type="password" id="resetConfirmPassword" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" minlength="8" required>
        </label>

        <button type="submit" class="primary-btn">Cập nhật mật khẩu</button>
      </form>

      <p class="auth-switch">Quay lại <a href="login.html">đăng nhập</a></p>
      <a href="index.html" class="home-link">Về trang chủ</a>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/auth.js?v=20260914-phone-fix"></script>
</body>
</html>
