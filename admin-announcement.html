<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thong bao - FoodHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html"><span class="brand-mark">&#127828;</span><span class="sidebar-label">FoodHub</span></a>
      <span class="sidebar-label">Bang quan tri</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quan tri">
      <a class="admin-nav-btn" href="admin.html?section=overview"><span class="nav-icon" data-icon="home" aria-hidden="true"></span><span class="nav-text">Tong quan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=orders"><span class="nav-icon" data-icon="orders" aria-hidden="true"></span><span class="nav-text">Don hang</span></a>
      <div class="admin-nav-group">
        <a class="admin-nav-btn admin-nav-toggle" href="admin.html?section=foods" aria-expanded="false"><span class="nav-icon" data-icon="utensils" aria-hidden="true"></span><span class="nav-text">Danh muc</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=foods&foodCategory=food"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Do an</span></a>
          <a href="admin.html?section=foods&foodCategory=drink"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Nuoc uong</span></a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html?section=accounts"><span class="nav-icon" data-icon="account" aria-hidden="true"></span><span class="nav-text">Tai khoan</span></a>
      <a class="admin-nav-btn active" href="admin.html?section=announcements"><span class="nav-icon" data-icon="bell" aria-hidden="true"></span><span class="nav-text">Thong bao</span></a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-page-bar">
      <button class="sidebar-toggle-btn admin-page-toggle" type="button" data-sidebar-toggle aria-label="Thu gon menu" aria-expanded="true"></button>
      <div class="admin-page-actions">
        <a class="admin-top-icon" href="index.html" title="Ve website" aria-label="Ve website"><span class="nav-icon" data-icon="home" aria-hidden="true"></span></a>
        <details class="admin-user-menu">
          <summary>
            <span class="admin-avatar"><span class="nav-icon" data-icon="account" aria-hidden="true"></span></span>
            <span class="admin-user-name" data-admin-user-name>admin</span>
          </summary>
          <div class="admin-user-dropdown">
            <button id="logoutBtn" type="button">Dang xuat</button>
          </div>
        </details>
      </div>
    </header>

    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="announcementFormTitle">Them moi thong bao</h2>
          <p><a href="admin.html">Quan ly thong bao</a> <span>/</span> <span id="announcementBreadcrumb">Them moi</span></p>
        </div>
      </div>

      <form id="announcementForm" class="account-page-form announcement-page-form">
        <label>
          Tieu de
          <input type="text" id="announcementTitle" maxlength="255" required>
        </label>

        <label>
          Noi dung ngan
          <textarea id="announcementContent" rows="4" placeholder="Nhap noi dung hien thi ben duoi tieu de"></textarea>
        </label>

        <label>
          Ngay dang
          <input type="datetime-local" id="announcementPublishedAt">
        </label>

        <div class="announcement-date-grid">
          <label>
            So ngay hieu luc
            <input type="number" id="announcementValidityDays" min="1" step="1" placeholder="Bo trong neu khong het han">
          </label>

          <label>
            Ngay het hieu luc
            <input type="datetime-local" id="announcementExpiresAt" readonly>
          </label>
        </div>

        <div class="announcement-checks">
          <label class="check-row">
            <input type="checkbox" id="announcementActive" checked>
            Hien thi tren trang chu
          </label>
        </div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Luu thong bao</button>
          <a href="admin.html" class="ghost-btn button-link">Quay ve</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="admin-announcement.js"></script>
</body>
</html>
