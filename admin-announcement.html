<!DOCTYPE html>
<!-- Trang tạo/sửa thông báo: nhập nội dung, thời gian hiệu lực và trạng thái hiển thị cho API admin/announcements. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông báo - FoodHub Admin</title>
  <link rel="stylesheet" href="assets/css/admin-base.css?v=20260824-mobile-audit">
  <link rel="stylesheet" href="assets/css/admin-announcement.css?v=20260814-voucher-ui-fix">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html" class="brand-logo" aria-label="FoodHub"><span class="brand-mark" aria-hidden="true"><span>FH</span></span><span class="brand-copy"><strong>FoodHub</strong><small>Admin</small></span></a>
      <span class="sidebar-label">Bảng quản trị</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quản trị">
      <a class="admin-nav-btn" href="admin.html?section=overview"><span class="nav-icon" data-icon="home" aria-hidden="true"></span><span class="nav-text">Tổng quan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=orders"><span class="nav-icon" data-icon="orders" aria-hidden="true"></span><span class="nav-text">Đơn hàng</span></a>
      <a class="admin-nav-btn" href="admin.html?section=categories"><span class="nav-icon" data-icon="categories" aria-hidden="true"></span><span class="nav-text">Quản lý danh mục</span></a>
      <div class="admin-nav-group">
        <a class="admin-nav-btn admin-nav-toggle" href="admin.html?section=foods" aria-expanded="false"><span class="nav-icon" data-icon="utensils" aria-hidden="true"></span><span class="nav-text">Quản lý món ăn</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=foods&foodCategory=food"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Đồ ăn</span></a>
          <a href="admin.html?section=foods&foodCategory=drink"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Nước uống</span></a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html?section=accounts"><span class="nav-icon" data-icon="account" aria-hidden="true"></span><span class="nav-text">Tài khoản</span></a>
      <a class="admin-nav-btn active" href="admin.html?section=announcements"><span class="nav-icon" data-icon="bell" aria-hidden="true"></span><span class="nav-text">Thông báo</span></a>
      <a class="admin-nav-btn" href="admin.html?section=advertisements"><span class="nav-icon" data-icon="ad" aria-hidden="true"></span><span class="nav-text">Quảng cáo</span></a>
      <a class="admin-nav-btn" href="admin.html?section=discounts"><span class="nav-icon" data-icon="ticket" aria-hidden="true"></span><span class="nav-text">Mã giảm giá</span></a>
      <a class="admin-nav-btn" href="admin.html?section=stats"><span class="nav-icon" data-icon="stats" aria-hidden="true"></span><span class="nav-text">Thống kê</span></a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-page-bar">
      <button class="sidebar-toggle-btn admin-page-toggle" type="button" data-sidebar-toggle aria-label="Thu gon menu" aria-expanded="true"></button>
      <div class="admin-page-actions">
        <a class="admin-top-icon" href="index.html" title="Ve website" aria-label="Ve website"><span class="nav-icon" data-icon="home" aria-hidden="true"></span></a>
        <details class="admin-user-menu">
          <summary>
            <span class="admin-avatar"><span class="nav-icon" data-icon="account" aria-hidden="true"></span></span>
            <span class="admin-user-name" data-admin-user-name>admin</span>
          </summary>
          <div class="admin-user-dropdown">
            <button id="logoutBtn" type="button">Đăng xuất</button>
          </div>
        </details>
      </div>
    </header>

    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="announcementFormTitle">Thêm mới thông báo</h2>
          <p><a href="admin.html">Quản lý thông báo</a> <span>/</span> <span id="announcementBreadcrumb">Thêm mới</span></p>
        </div>
      </div>

      <form id="announcementForm" class="account-page-form announcement-page-form">
        <label>
          Tiêu đề
          <input type="text" id="announcementTitle" maxlength="255" required>
        </label>

        <label>
          Nội dung ngắn
          <textarea id="announcementContent" rows="4" placeholder="Nhập nội dung hiển thị bên dưới tiêu đề"></textarea>
        </label>

        <label>
          Ngày đăng
          <input type="datetime-local" id="announcementPublishedAt">
        </label>

        <div class="announcement-date-grid">
          <label>
            Số ngày hiệu lực
            <input type="number" id="announcementValidityDays" min="1" step="1" placeholder="Bỏ trống nếu không hết hạn">
          </label>

          <label>
            Ngày hết hiệu lực
            <input type="datetime-local" id="announcementExpiresAt" readonly>
          </label>
        </div>

        <div class="announcement-checks">
          <label class="check-row">
            <input type="checkbox" id="announcementActive" checked>
            Hiển thị trên trang chủ
          </label>
        </div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Lưu thông báo</button>
          <a href="admin.html" class="ghost-btn button-link">Quay về</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/admin/admin-sidebar.js?v=20260824-admin-pin-lock"></script>
  <script src="assets/js/admin/admin-announcement.js"></script>
</body>
</html>
