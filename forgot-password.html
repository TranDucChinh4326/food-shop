<!DOCTYPE html>
<!-- Trang quên mật khẩu: người dùng nhập email để backend gửi mã OTP đặt lại mật khẩu. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - FoodHub</title>
  <link rel="stylesheet" href="assets/css/auth-base.css?v=20260820-ui-polish">
  <link rel="stylesheet" href="assets/css/login.css?v=20260819-modern-auth">
</head>
<body>
  <main class="auth-page">
    <section class="auth-box">
      <a href="index.html" class="auth-brand">🍔 FoodHub</a>
      <p class="auth-kicker">Khôi phục tài khoản</p>
      <h1>Quên mật khẩu</h1>

      <form onsubmit="forgotPassword(event)">
        <label>
          Email đã đăng ký
          <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <button type="submit" class="primary-btn">Gửi mã OTP đặt lại mật khẩu</button>
      </form>

      <p class="auth-switch">Đã nhớ mật khẩu? <a href="login.html">Đăng nhập</a></p>
      <a href="index.html" class="home-link">Về trang chủ</a>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
