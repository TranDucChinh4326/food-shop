<!DOCTYPE html>
<!-- Trang tra cứu đơn: hiển thị trạng thái đơn hàng và thanh toán sau khi khách đặt món. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử đơn hàng - FoodHub</title>
  <link rel="stylesheet" href="assets/css/base.css?v=20260824-pin-boxes">
  <link rel="stylesheet" href="assets/css/track.css?v=20260814-voucher-ui-fix">
</head>
<body>
  <div data-shared-header></div>

  <main class="track-page track-page-compact">
    <section class="track-card-shell">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Đơn hàng của tôi</span>
          <h2>Lịch sử đặt hàng</h2>
          <p>Lọc nhanh theo mã đơn, thông tin giao hàng hoặc ngày đặt.</p>
        </div>
        <a href="menu.html" class="text-link">Đặt thêm món</a>
      </div>

      <form class="history-filter" onsubmit="loadOrderHistory(event)">
        <input type="search" id="orderSearch" placeholder="Tìm mã đơn, tên, SĐT hoặc địa chỉ">
        <input type="date" id="orderDate">
        <button type="submit" class="btn">Lọc đơn</button>
        <button type="button" class="btn muted-btn" onclick="resetOrderHistoryFilter()">Xóa lọc</button>
      </form>

      <div id="track-result" class="track-result"></div>
    </section>
  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/shared-layout.js?v=20260824-track-timeout"></script>
  <script src="assets/js/script.js?v=20260826-system-audit"></script>
</body>
</html>
