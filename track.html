<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu đơn hàng - FoodHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">🍔 FoodHub</a>

    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="menu.html">Thực đơn</a>
      <a href="cart.html">Giỏ hàng</a>
      <a href="track.html">Tra cứu đơn</a>
      <a href="contact.html">Liên hệ</a>
    </nav>

    <div id="user-area">
      <a href="login.html" class="header-action primary">Đăng nhập</a>
      <a href="register.html" class="header-action secondary">Đăng ký</a>
    </div>

    <a href="cart.html" class="cart-btn">🛒 Giỏ hàng <span id="cart-count">0</span></a>
  </header>

  <main class="track-page">
    <section class="track-hero">
      <span class="badge">Theo dõi đơn</span>
      <h1>Tra cứu trạng thái đơn hàng</h1>
      <p>Nhập mã đơn để xem tiến độ xử lý, thông tin giao hàng và danh sách món đã đặt.</p>
    </section>

    <section class="track-card-shell">
      <form class="track-form" onsubmit="trackOrder(event)">
        <input type="number" id="trackOrderId" placeholder="Nhập mã đơn hàng" min="1" required>
        <button type="submit" class="btn">Tra cứu</button>
      </form>

      <div id="track-result" class="track-result"></div>
    </section>
  </main>

  <footer>
    <p>@2026 Tran Duc Chinh IT</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
