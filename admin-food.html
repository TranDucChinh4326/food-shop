<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon an - FoodHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html">FoodHub</a>
      <span>Bang quan tri</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quan tri">
      <a class="admin-nav-btn" href="admin.html">Tong quan</a>
      <a class="admin-nav-btn" href="admin.html">Don hang</a>
      <div class="admin-nav-group">
        <a class="admin-nav-btn active" href="admin.html">Danh muc</a>
        <div class="admin-subnav">
          <a href="admin.html">Do an</a>
          <a href="admin.html">Nuoc uong</a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html">Tai khoan</a>
      <a class="admin-nav-btn" href="admin.html">Thong bao</a>
    </nav>

    <div class="sidebar-footer">
      <a href="admin.html">Ve danh sach</a>
      <button id="logoutBtn" type="button">Dang xuat</button>
    </div>
  </aside>

  <main class="admin-main">
    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="foodFormTitle">Them moi mon</h2>
          <p><a href="admin.html">Quan ly mon an</a> <span>/</span> <span id="foodBreadcrumb">Them moi</span></p>
        </div>
      </div>

      <form id="foodPageForm" class="account-page-form announcement-page-form food-page-form">
        <input type="hidden" id="foodId">

        <label>
          Ten mon
          <input type="text" id="foodName" required>
        </label>

        <div class="announcement-date-grid">
          <label>
            Danh muc
            <select id="foodCategory" required>
              <option value="1">Burger</option>
              <option value="2">Pizza</option>
              <option value="3">Mi & Pho</option>
              <option value="4">Do uong</option>
            </select>
          </label>

          <label>
            Gia
            <input type="number" id="foodPrice" min="1000" step="1000" required>
          </label>
        </div>

        <label>
          Link anh
          <input type="url" id="foodImage" placeholder="https://...">
        </label>

        <label>
          Mo ta
          <textarea id="foodDescription" rows="4"></textarea>
        </label>

        <label class="check-row">
          <input type="checkbox" id="foodActive" checked>
          Dang ban
        </label>

        <div id="foodPreview" class="food-preview" hidden></div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Luu mon</button>
          <a href="admin.html" class="ghost-btn button-link">Quay ve</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="admin-food.js"></script>
</body>
</html>
