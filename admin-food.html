<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon an - FoodHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html"><span class="brand-mark">🍔</span><span class="sidebar-label">FoodHub</span></a>
      <button class="sidebar-toggle-btn" type="button" data-sidebar-toggle aria-label="Thu gon menu" aria-expanded="true">☰</button>
      <span class="sidebar-label">Bang quan tri</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quan tri">
      <a class="admin-nav-btn" href="admin.html?section=overview"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-text">Tong quan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=orders"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-text">Don hang</span></a>
      <div class="admin-nav-group is-open">
        <a class="admin-nav-btn active" href="admin.html?section=foods"><span class="nav-icon" aria-hidden="true">◫</span><span class="nav-text">Danh muc</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=foods&foodCategory=food"><span class="nav-icon" aria-hidden="true">◦</span><span class="nav-text">Do an</span></a>
          <a href="admin.html?section=foods&foodCategory=drink"><span class="nav-icon" aria-hidden="true">◦</span><span class="nav-text">Nuoc uong</span></a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html?section=accounts"><span class="nav-icon" aria-hidden="true">◎</span><span class="nav-text">Tai khoan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=announcements"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-text">Thong bao</span></a>
    </nav>

    <div class="sidebar-footer">
      <a href="admin.html"><span class="nav-icon" aria-hidden="true">↩</span><span class="nav-text">Ve danh sach</span></a>
      <button id="logoutBtn" type="button"><span class="nav-icon" aria-hidden="true">⎋</span><span class="nav-text">Dang xuat</span></button>
    </div>
  </aside>

  <main class="admin-main">
    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="foodFormTitle">Them moi mon</h2>
          <p><a href="admin.html">Quan ly mon an</a> <span>/</span> <span id="foodBreadcrumb">Them moi</span></p>
        </div>
      </div>

      <form id="foodPageForm" class="account-page-form announcement-page-form food-page-form">
        <input type="hidden" id="foodId">

        <label>
          Ten mon
          <input type="text" id="foodName" required>
        </label>

        <div class="announcement-date-grid">
          <label>
            Nhom mon
            <input type="hidden" id="foodType" value="food">
            <input type="text" id="foodTypeLabel" value="Do an" disabled>
          </label>

          <label>
            Danh muc con
            <select id="foodCategory" required>
              <option value="">Dang tai danh muc...</option>
            </select>
          </label>
        </div>

        <div class="announcement-date-grid">
          <label>
            Gia
            <input type="number" id="foodPrice" min="1000" step="1000" required>
          </label>
        </div>

        <label>
          Hinh anh
          <input type="file" id="foodImageFile" accept="image/*">
          <input type="hidden" id="foodImage">
          <small class="field-hint">Chon anh JPG, PNG hoac WebP. Anh se duoc luu tu dong vao he thong.</small>
        </label>

        <label>
          Mo ta
          <textarea id="foodDescription" rows="4"></textarea>
        </label>

        <label class="check-row">
          <input type="checkbox" id="foodActive" checked>
          Dang ban
        </label>

        <div id="foodPreview" class="food-preview" hidden></div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Luu mon</button>
          <a href="admin.html" class="ghost-btn button-link">Quay ve</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="admin-food.js"></script>
</body>
</html>
