<!DOCTYPE html>
<!-- Trang tạo/sửa món ăn: form quản lý tên, danh mục, giá, tồn kho, ảnh và trạng thái bán của món. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Món ăn - FoodHub Admin</title>
  <link rel="stylesheet" href="assets/css/admin-base.css?v=20260824-admin-pin-boxes">
  <link rel="stylesheet" href="assets/css/admin-food.css?v=20260814-voucher-ui-fix">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html" class="brand-logo" aria-label="FoodHub"><span class="brand-mark" aria-hidden="true"><span>FH</span></span><span class="brand-copy"><strong>FoodHub</strong><small>Admin</small></span></a>
      <span class="sidebar-label">Bảng quản trị</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quản trị">
      <a class="admin-nav-btn" href="admin.html?section=overview"><span class="nav-icon" data-icon="home" aria-hidden="true"></span><span class="nav-text">Tổng quan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=orders"><span class="nav-icon" data-icon="orders" aria-hidden="true"></span><span class="nav-text">Đơn hàng</span></a>
      <a class="admin-nav-btn" href="admin.html?section=categories"><span class="nav-icon" data-icon="categories" aria-hidden="true"></span><span class="nav-text">Quản lý danh mục</span></a>
      <div class="admin-nav-group is-open">
        <a class="admin-nav-btn admin-nav-toggle active" href="admin.html?section=foods" aria-expanded="true"><span class="nav-icon" data-icon="utensils" aria-hidden="true"></span><span class="nav-text">Quản lý món ăn</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=foods&foodCategory=all"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Danh sách món</span></a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html?section=accounts"><span class="nav-icon" data-icon="account" aria-hidden="true"></span><span class="nav-text">Tài khoản</span></a>
      <a class="admin-nav-btn" href="admin.html?section=announcements"><span class="nav-icon" data-icon="bell" aria-hidden="true"></span><span class="nav-text">Thông báo</span></a>
      <a class="admin-nav-btn" href="admin.html?section=discounts"><span class="nav-icon" data-icon="ticket" aria-hidden="true"></span><span class="nav-text">Mã giảm giá</span></a>
      <a class="admin-nav-btn" href="admin.html?section=stats"><span class="nav-icon" data-icon="stats" aria-hidden="true"></span><span class="nav-text">Thống kê</span></a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-page-bar">
      <button class="sidebar-toggle-btn admin-page-toggle" type="button" data-sidebar-toggle aria-label="Thu gon menu" aria-expanded="true"></button>
      <div class="admin-page-actions">
        <a class="admin-top-icon" href="index.html" title="Ve website" aria-label="Ve website"><span class="nav-icon" data-icon="home" aria-hidden="true"></span></a>
        <details class="admin-user-menu">
          <summary>
            <span class="admin-avatar"><span class="nav-icon" data-icon="account" aria-hidden="true"></span></span>
            <span class="admin-user-name" data-admin-user-name>admin</span>
          </summary>
          <div class="admin-user-dropdown">
            <button id="logoutBtn" type="button">Đăng xuất</button>
          </div>
        </details>
      </div>
    </header>

    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="foodFormTitle">Thêm mới món</h2>
          <p><a href="admin.html">Quản lý món ăn</a> <span>/</span> <span id="foodBreadcrumb">Thêm mới</span></p>
        </div>
      </div>

      <form id="foodPageForm" class="account-page-form announcement-page-form food-page-form">
        <input type="hidden" id="foodId">

        <label>
          Tên món
          <input type="text" id="foodName" required>
        </label>

        <div class="announcement-date-grid">
          <label>
            Mục cha
            <input type="hidden" id="foodType" value="food">
            <input type="text" id="foodTypeLabel" value="Đồ ăn" disabled>
          </label>

          <label>
            Phân loại trong mục
            <select id="foodCategory" required>
              <option value="">Đang tải danh mục...</option>
            </select>
          </label>
        </div>

        <div class="announcement-date-grid">
          <label>
            Giá
            <input type="number" id="foodPrice" min="1000" step="1000" required>
          </label>

          <label>
            Số lượng còn
            <input type="number" id="foodStockQuantity" min="0" step="1" value="0" required>
          </label>
        </div>

        <label>
          Hình ảnh
          <input type="file" id="foodImageFile" accept="image/*">
          <input type="hidden" id="foodImage">
          <small class="field-hint">Chọn ảnh JPG, PNG hoặc WebP. Ảnh sẽ được lưu tự động vào hệ thống.</small>
        </label>

        <label>
          Mô tả
          <textarea id="foodDescription" rows="4"></textarea>
        </label>

        <label class="check-row">
          <input type="checkbox" id="foodActive" checked>
          Đang bán
        </label>

        <div id="foodPreview" class="food-preview" hidden></div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Lưu món</button>
          <a href="admin.html" class="ghost-btn button-link">Quay về</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/admin/admin-sidebar.js?v=20260824-realtime-orders"></script>
  <script src="assets/js/admin/admin-food.js?v=20260824-toast-stack"></script>
</body>
</html>
