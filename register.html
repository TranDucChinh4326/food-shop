<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - FoodHub</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-box">
      <a href="index.html" class="auth-brand">🍔 FoodHub</a>
      <p class="auth-kicker">Tạo tài khoản mới</p>
      <h1>Đăng ký</h1>

      <div class="social-grid" aria-label="Đăng ký nhanh">
        <button type="button" class="social-btn google" onclick="loginWithGoogle()">
          <span>G</span>
          Google
        </button>
        <button type="button" class="social-btn facebook" onclick="loginWithFacebook()">
          <span>f</span>
          Facebook
        </button>
      </div>

      <div class="auth-divider"><span>hoặc tạo bằng email</span></div>

      <form onsubmit="register(event)">
        <label>
          Họ và tên
          <input type="text" id="fullname" placeholder="Nguyễn Văn A" autocomplete="name" required>
        </label>

        <label>
          Username
          <input type="text" id="username" placeholder="nguyenvana" autocomplete="username" required>
        </label>

        <label>
          Email
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>
          Mật khẩu
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" required>
        </label>

        <button type="submit" class="primary-btn">Tạo tài khoản</button>
      </form>

      <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      <a href="index.html" class="home-link">Về trang chủ</a>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
