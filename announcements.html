<!DOCTYPE html>
<!-- Trang thông báo công khai: hiển thị danh sách thông báo/voucher đang hiệu lực từ backend. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông báo - FoodHub</title>
  <link rel="stylesheet" href="assets/css/base.css?v=20260823-floating-ads-fit">
  <link rel="stylesheet" href="assets/css/announcements.css?v=20260818-mobile-announcements">
</head>
<body>
  <div data-shared-header></div>

  <main class="announcements-page">
    <section class="announcement-archive-panel">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Danh sách</span>
          <h2>Tất cả thông báo</h2>
        </div>
      </div>
      <div class="announcement-filters">
        <input type="search" id="announcementArchiveSearch" placeholder="Tìm kiếm thông báo">
        <input type="date" id="announcementArchiveDate" aria-label="Loc theo ngày đăng">
        <select id="announcementArchivePageSize" aria-label="So thông báo mới trang">
          <option value="5" selected>5 dong</option>
          <option value="10">10 dong</option>
          <option value="20">20 dong</option>
        </select>
      </div>
      <div id="announcementArchiveList" class="announcement-archive-list">
        Đang tải thông báo...
      </div>
      <div id="announcementArchivePager" class="announcement-archive-pager"></div>
    </section>
  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/shared-layout.js?v=20260823-footer-layout"></script>
  <script src="assets/js/script.js?v=20260823-floating-ads-fit"></script>
</body>
</html>
