<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - FoodHub</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-box">
      <a href="index.html" class="auth-brand">🍔 FoodHub</a>
      <p class="auth-kicker">Chào mừng bạn quay lại</p>
      <h1>Đăng nhập</h1>

      <div class="social-grid" aria-label="Đăng nhập nhanh">
        <button type="button" class="social-btn google" onclick="showComingSoon('Google')">
          <span>G</span>
          Google
        </button>
        <button type="button" class="social-btn facebook" onclick="showComingSoon('Facebook')">
          <span>f</span>
          Facebook
        </button>
      </div>

      <div class="auth-divider"><span>hoặc dùng email</span></div>

      <form onsubmit="login(event)">
        <label>
          Email
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>
          Mật khẩu
          <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
        </label>

        <button type="submit" class="primary-btn">Đăng nhập</button>
      </form>

      <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      <a href="index.html" class="home-link">Về trang chủ</a>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
