<!DOCTYPE html>
<!-- Trang chủ Bếp 1979: hiển thị món nổi bật, danh mục, thông báo, quảng cáo và chatbox hỗ trợ. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bếp 1979 - Đặt đồ ăn online</title>
  <script>(function(){try{var s=localStorage.getItem("foodhub_theme");var t=s==="dark"||s==="light"?s:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(_){}})();</script>
  <link rel="stylesheet" href="assets/css/base.css?v=20260914-equal-buttons-v8">
  <link rel="stylesheet" href="assets/css/index.css?v=20260914-theme-v1">
  <link rel="stylesheet" href="assets/css/intro.css?v=20260913-clean-cta-v6">
</head>
<body>
  <div data-shared-header></div>

  <main>
    <section class="flash-sale-banner" data-flash-sale-banner aria-label="Giờ vàng Flash Sale" hidden>
      <div class="flash-sale-info">
        <span class="flash-sale-badge">Flash Sale</span>
        <div class="flash-sale-title">
          <span data-flash-sale-title>Flash sale hôm nay</span>
          <small data-flash-sale-subtitle>Giá giảm theo từng món, số lượng có hạn.</small>
        </div>
      </div>
      <div class="flash-sale-items" data-flash-sale-items></div>
      <div class="countdown-timer" data-flash-sale-countdown aria-label="Thời gian còn lại">
        <span class="timer-unit">
          <b class="timer-num" data-timer-hours>00</b>
          <small>Giờ</small>
        </span>
        <span class="timer-sep">:</span>
        <span class="timer-unit">
          <b class="timer-num" data-timer-minutes>00</b>
          <small>Phút</small>
        </span>
        <span class="timer-sep">:</span>
        <span class="timer-unit">
          <b class="timer-num" data-timer-seconds>00</b>
          <small>Giây</small>
        </span>
      </div>
    </section>

    <section class="home-combo-section" hidden>
      <div id="homeComboBanners" class="combo-banner-shell"></div>
    </section>

    <section class="home-shop-section">
      <div class="home-section-heading">
        <div>
          <span class="section-kicker"><i class="flame-icon">🔥</i> Bán chạy</span>
          <h2>Món ăn bán chạy nhất</h2>
        </div>
      </div>
      <div id="homeBestSellers" class="best-seller-strip">
        <p>Đang tải món bán chạy...</p>
      </div>
    </section>

    <section class="home-shop-section home-catalog-section">
      <div class="home-section-heading">
        <div>
          <span class="section-kicker">Thực đơn</span>
          <h2>Tất cả món ăn</h2>
        </div>
      </div>
      <div id="homeFoodSections" class="home-food-sections">
        <p>Đang tải thực đơn...</p>
      </div>
    </section>

    <section class="home-shop-section home-reviews-section">
      <div class="home-section-heading">
        <div>
          <span class="section-kicker">Bình luận</span>
          <h2>Khách hàng nói gì về món ăn</h2>
        </div>
        <div id="homeReviewFilters" class="home-review-filters" aria-label="Bộ lọc bình luận"></div>
      </div>
      <div id="homeReviewSummary" class="home-review-summary-shell" hidden></div>
      <div id="homeReviewList" class="home-review-grid">
        <p>Đang tải bình luận...</p>
      </div>
    </section>

  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/intro.js?v=20260913-clean-cta-v6"></script>
  <script src="assets/js/shared-layout.js?v=20260914-phone-fix"></script>
  <script src="assets/js/script.js?v=20260914-phone-fix"></script>
</body>
</html>
