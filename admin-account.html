<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tai khoan - FoodHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html"><span class="brand-mark">&#127828;</span><span class="sidebar-label">FoodHub</span></a>
      <span class="sidebar-label">Bang quan tri</span>
    </div>

    <nav class="admin-nav" aria-label="Menu quan tri">
      <a class="admin-nav-btn" href="admin.html?section=overview"><span class="nav-icon" data-icon="home" aria-hidden="true"></span><span class="nav-text">Tong quan</span></a>
      <a class="admin-nav-btn" href="admin.html?section=orders"><span class="nav-icon" data-icon="orders" aria-hidden="true"></span><span class="nav-text">Don hang</span></a>
      <a class="admin-nav-btn" href="admin.html?section=categories"><span class="nav-icon" data-icon="categories" aria-hidden="true"></span><span class="nav-text">Quan ly danh muc</span></a>
      <div class="admin-nav-group">
        <a class="admin-nav-btn admin-nav-toggle" href="admin.html?section=foods" aria-expanded="false"><span class="nav-icon" data-icon="utensils" aria-hidden="true"></span><span class="nav-text">Quan ly mon an</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=foods&foodCategory=food"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Do an</span></a>
          <a href="admin.html?section=foods&foodCategory=drink"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Nuoc uong</span></a>
        </div>
      </div>
      <div class="admin-nav-group is-open">
        <a class="admin-nav-btn admin-nav-toggle active" href="admin.html?section=accounts&accountType=staff" aria-expanded="true"><span class="nav-icon" data-icon="account" aria-hidden="true"></span><span class="nav-text">Tai khoan</span></a>
        <div class="admin-subnav">
          <a href="admin.html?section=accounts&accountType=staff"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Nhan vien</span></a>
          <a href="admin.html?section=accounts&accountType=customers"><span class="nav-icon" data-icon="dot" aria-hidden="true"></span><span class="nav-text">Khach hang</span></a>
        </div>
      </div>
      <a class="admin-nav-btn" href="admin.html?section=announcements"><span class="nav-icon" data-icon="bell" aria-hidden="true"></span><span class="nav-text">Thong bao</span></a>
      <a class="admin-nav-btn" href="admin.html?section=discounts"><span class="nav-icon" data-icon="ticket" aria-hidden="true"></span><span class="nav-text">Ma giam gia</span></a>
      <a class="admin-nav-btn" href="admin.html?section=stats"><span class="nav-icon" data-icon="stats" aria-hidden="true"></span><span class="nav-text">Thong ke</span></a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-page-bar">
      <button class="sidebar-toggle-btn admin-page-toggle" type="button" data-sidebar-toggle aria-label="Thu gon menu" aria-expanded="true"></button>
      <div class="admin-page-actions">
        <a class="admin-top-icon" href="index.html" title="Ve website" aria-label="Ve website"><span class="nav-icon" data-icon="home" aria-hidden="true"></span></a>
        <details class="admin-user-menu">
          <summary>
            <span class="admin-avatar"><span class="nav-icon" data-icon="account" aria-hidden="true"></span></span>
            <span class="admin-user-name" data-admin-user-name>admin</span>
          </summary>
          <div class="admin-user-dropdown">
            <button id="logoutBtn" type="button">Dang xuat</button>
          </div>
        </details>
      </div>
    </header>

    <section class="panel account-form-panel">
      <div class="page-heading form-page-heading">
        <div>
          <h2 id="accountFormTitle">Them moi tai khoan</h2>
          <p><a id="accountBackLink" href="admin.html?section=accounts&accountType=staff">Quan ly nguoi dung</a> <span>/</span> <span id="accountBreadcrumb">Them moi</span></p>
        </div>
      </div>

      <form id="accountForm" class="account-page-form">
        <div class="staff-form-grid">
          <label>
            Ho va ten
            <input type="text" id="accountName" required>
          </label>

          <label>
            Email
            <input type="email" id="accountEmail" required>
          </label>

          <label id="passwordField">
            Mat khau tam
            <input type="password" id="accountPassword" minlength="6">
          </label>

          <label>
            Vai tro
            <select id="accountRole" required>
              <option value="STAFF_SALES">Nhan vien ban hang</option>
              <option value="STAFF_CONTENT">Quan ly mon an</option>
              <option value="STAFF_MANAGER">Quan ly nhan vien</option>
              <option value="USER">Khach hang</option>
            </select>
          </label>
        </div>

        <div id="permissionPanel">
          <h3>Quyen tai khoan</h3>
          <p class="form-note">Khach hang thong thuong khong can cap quyen quan tri.</p>
          <div id="accountPermissions" class="permission-list account-permissions"></div>
        </div>

        <div class="form-actions account-form-actions">
          <button type="submit" class="primary-btn">Luu tai khoan</button>
          <a id="accountCancelLink" href="admin.html?section=accounts&accountType=staff" class="ghost-btn button-link">Quay ve</a>
        </div>
      </form>
    </section>
  </main>

  <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="admin-account.js"></script>
</body>
</html>
