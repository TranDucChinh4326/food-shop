<!DOCTYPE html>
<!-- Trang thực đơn: hiển thị danh sách món từ API foods và cho phép lọc theo danh mục. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực đơn - FoodHub</title>
  <link rel="stylesheet" href="assets/css/base.css?v=20260825-heart-fix-v4">
  <link rel="stylesheet" href="assets/css/menu.css?v=20260825-heart-fix-v4">
</head>
<body>
  <div data-shared-header></div>

  <main class="menu-page">
    <section class="menu-panel">
      <div class="menu-toolbar">
        <div>
          <h2>Thực đơn FoodHub</h2>
          <p>Khám phá trọn bộ các món ăn tươi ngon chuẩn vị, giao nhanh tận nơi trong 30 phút.</p>
        </div>
        <div class="filter-box">
          <input type="search" id="searchInput" placeholder="Tìm kiếm món ăn..." oninput="renderFoods()" aria-label="Tìm kiếm món ăn">
        </div>
      </div>

      <div id="menuCategoryChips" class="menu-category-chips" aria-label="Lọc danh mục"></div>

      <div class="food-list" id="food-list" aria-live="polite"></div>
    </section>
  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/shared-layout.js?v=20260825-chips-fix-v5"></script>
  <script src="assets/js/script.js?v=20260825-chips-fix-v5"></script>
</body>
</html>
