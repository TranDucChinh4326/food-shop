<!DOCTYPE html>
<!-- Trang thực đơn: hiển thị danh sách món từ API foods và cho phép lọc theo danh mục. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực đơn - FoodHub</title>
  <link rel="stylesheet" href="assets/css/base.css?v=20260824-pin-boxes">
  <link rel="stylesheet" href="assets/css/menu.css?v=20260824-heading-scale">
</head>
<body>
  <div data-shared-header></div>

  <main class="menu-page">
    <section class="menu-panel">
      <div class="menu-toolbar">
        <div>
          <h2 id="menuCategoryHeading">Tất cả món</h2>
          <p id="menuCategoryDescription">Danh sách món được cập nhật từ hệ thống FoodHub.</p>
        </div>

        <div class="filter-box">
          <input type="text" id="searchInput" placeholder="Tìm món ăn..." oninput="renderFoods()">
        </div>
      </div>
      <div id="menuCategoryChips" class="menu-category-chips" aria-label="Lọc danh mục"></div>

      <div id="food-list" class="food-list"></div>
    </section>
  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/shared-layout.js?v=20260824-realtime-orders"></script>
  <script src="assets/js/script.js?v=20260824-realtime-orders"></script>
</body>
</html>
