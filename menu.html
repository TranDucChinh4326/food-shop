<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực đơn - FoodHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <a class="logo" href="index.html">🍔 FoodHub</a>

      <div class="header-tools">
        <a href="menu.html" class="top-icon" title="Tìm kiếm món ăn" aria-label="Tìm kiếm món ăn">⌕</a>
        <a href="contact.html" class="top-icon" title="Hotline" aria-label="Hotline">☎</a>
        <a href="announcements.html" class="top-icon" title="Thông báo" aria-label="Thông báo">🔔</a>
        <div id="user-area">
          <a href="login.html" class="header-action primary">Đăng nhập</a>
          <a href="register.html" class="header-action secondary">Đăng ký</a>
        </div>
        <a href="cart.html" class="cart-btn">🛒 <span>Giỏ hàng</span> <strong id="cart-count">0</strong></a>
      </div>
    </div>

    <section class="site-announcements" aria-label="Thông báo FoodHub">
      <div class="announcement-shell">
        <div id="publicAnnouncements" class="public-announcements">
          Đang tải thông báo...
        </div>
      </div>
    </section>

    <nav>
      <a href="index.html">Trang chu</a>
      <div class="nav-dropdown" data-public-category-menu="food">
        <a class="nav-dropdown-toggle" href="menu.html?category=food">Do an <span aria-hidden="true">▾</span></a>
        <div class="nav-dropdown-panel">
          <a href="menu.html?category=com">Com</a>
          <a href="menu.html?category=pho">Pho</a>
          <a href="menu.html?category=mi">Mi</a>
          <a href="menu.html?category=bun">Bun</a>
        </div>
      </div>
      <div class="nav-dropdown" data-public-category-menu="drink">
        <a class="nav-dropdown-toggle" href="menu.html?category=drink">Do uong <span aria-hidden="true">▾</span></a>
        <div class="nav-dropdown-panel">
          <a href="menu.html?category=tra">Tra</a>
          <a href="menu.html?category=ca-phe">Ca phe</a>
          <a href="menu.html?category=nuoc-ep-sinh-to">Nuoc ep va sinh to</a>
          <a href="menu.html?category=nuoc-dong-chai">Nuoc dong chai</a>
        </div>
      </div>
      <a href="cart.html">Giỏ hàng</a>
      <a href="track.html">Lịch sử đơn</a>
      <a href="contact.html">Liên hệ</a>
    </nav>
  </header>

  <main class="menu-page">
    <section class="menu-panel">
      <div class="menu-toolbar">
        <div>
          <h2 id="menuCategoryHeading">Tất cả món</h2>
          <p id="menuCategoryDescription">Danh sách món được cập nhật từ hệ thống FoodHub.</p>
        </div>

        <div class="filter-box">
          <input type="text" id="searchInput" placeholder="Tìm món ăn..." oninput="renderFoods()">
        </div>
      </div>

      <div id="food-list" class="food-list"></div>
    </section>
  </main>

  <footer>
    <p>@2026 Tran Duc Chinh IT</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
