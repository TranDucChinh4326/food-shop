<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực đơn - FoodHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">🍔 FoodHub</a>

    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="menu.html">Thực đơn</a>
      <a href="cart.html">Giỏ hàng</a>
      <a href="track.html">Tra cứu đơn</a>
      <a href="contact.html">Liên hệ</a>
    </nav>

    <div id="user-area">
      <a href="login.html" class="header-action primary">Đăng nhập</a>
      <a href="register.html" class="header-action secondary">Đăng ký</a>
    </div>

    <a href="cart.html" class="cart-btn">🛒 Giỏ hàng <span id="cart-count">0</span></a>
  </header>

  <main>
    <section class="page-title">
      <h1>Thực đơn FoodHub</h1>
      <p>Chọn món yêu thích và thêm vào giỏ hàng.</p>
    </section>

    <section class="categories">
      <h2>Danh mục món ăn</h2>

      <div class="filter-box">
        <input type="text" id="searchInput" placeholder="Tìm món ăn..." oninput="renderFoods()">

        <select id="categoryFilter" onchange="renderFoods()">
          <option value="all">Tất cả</option>
          <option value="burger">Burger</option>
          <option value="pizza">Pizza</option>
          <option value="noodle">Mì & Phở</option>
          <option value="drink">Đồ uống</option>
        </select>
      </div>
    </section>

    <section class="menu">
      <h2>Món ăn nổi bật</h2>
      <div id="food-list" class="food-list"></div>
    </section>
  </main>

  <footer>
    <p>@2026 Tran Duc Chinh IT</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
