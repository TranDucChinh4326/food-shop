<!DOCTYPE html>
<!-- Trang voucher công khai: hiển thị các phiếu giảm giá đang phát hành từ backend. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher - FoodHub</title>
  <link rel="stylesheet" href="assets/css/base.css?v=20260826-live-flash-sale-v1">
  <link rel="stylesheet" href="assets/css/announcements.css?v=20260826-banner-align-v2">
</head>
<body>
  <div data-shared-header></div>

  <main class="announcements-page">
    <section class="flash-sale-banner" aria-label="Giờ vàng săn voucher">
      <div class="flash-sale-info">
        <span class="flash-sale-badge">⚡ Giờ vàng</span>
        <div class="flash-sale-title">
          Khung giờ săn voucher hot
          <small>Số lượng có hạn, nhanh tay nhận ưu đãi trước khi hết giờ!</small>
        </div>
      </div>
      <div class="countdown-timer" data-flash-sale-countdown aria-label="Thời gian còn lại">
        <span class="timer-unit">
          <b class="timer-num" data-timer-hours>00</b>
          <small>Giờ</small>
        </span>
        <span class="timer-sep">:</span>
        <span class="timer-unit">
          <b class="timer-num" data-timer-minutes>00</b>
          <small>Phút</small>
        </span>
        <span class="timer-sep">:</span>
        <span class="timer-unit">
          <b class="timer-num" data-timer-seconds>00</b>
          <small>Giây</small>
        </span>
      </div>
    </section>

    <section class="voucher-panel">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Voucher</span>
          <h2>Phiếu giảm giá đang phát hành</h2>
        </div>
      </div>
      <div id="availableVouchersList" class="voucher-list">Đang tải voucher...</div>
    </section>
  </main>
  <div data-shared-footer></div>

  <script src="config.js"></script>
  <script src="assets/js/shared-layout.js?v=20260824-track-timeout"></script>
  <script src="assets/js/script.js?v=20260826-live-flash-sale-v1"></script>
</body>
</html>
